name: Publiceer site

# Bouwt de site uit bron/paginas (per pagina geëxporteerde Confluence-markdown) en
# bron/bijlagen (genummerde exports uit BizzDesign) en publiceert via GitHub Pages.
# Nieuwe pagina's worden in bron/structuur.yml geplaatst; die aanvulling wordt teruggecommit.

on:
  push:
    branches: [main]
    paths: ["bron/**", "scripts/**", "respec/**", "site_root/**",
            "mkdocs.base.yml", "publicatie.yml", "requirements.txt", ".github/workflows/publiceer.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      klaar: ${{ steps.bron.outputs.klaar }}
    steps:
      - uses: actions/checkout@v4
      - name: Controleer of er pagina's zijn
        id: bron
        run: |
          if find bron/paginas -name '*.md' | grep -q .; then echo "klaar=true" >> "$GITHUB_OUTPUT"; else
            echo "klaar=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nog geen pagina's in bron/paginas/; upload eerst Markdown-exports uit Confluence."
          fi
      - uses: actions/setup-python@v5
        if: steps.bron.outputs.klaar == 'true'
        with: {python-version: "3.12", cache: pip}
      - if: steps.bron.outputs.klaar == 'true'
        run: pip install -r requirements.txt
      - name: Inname en bouw (MkDocs en ReSpec)
        if: steps.bron.outputs.klaar == 'true'
        run: python scripts/bouw_site.py
      - name: Aangevulde structuur terugzetten
        if: steps.bron.outputs.klaar == 'true'
        run: |
          if [ -n "$(git status --porcelain bron/structuur.yml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bron/structuur.yml
            git commit -q -m "Paginastructuur aangevuld met nieuwe pagina's"
            git pull -q --rebase && git push
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.bron.outputs.klaar == 'true'
        with: {path: _site}
  deploy:
    needs: build
    if: needs.build.outputs.klaar == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
