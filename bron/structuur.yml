    - "Procesdomein: Plannen"  # nog geen bestand
    - "Procesdomein: Handelen"
    - "Procesdomein: Uitvoeren"
    - "Procesdomein: Meten"
    - "Procesdomein: Verrekenen":
        - "Valideren transport (grenswaarde)"  # nog geen bestand
    - "Procesdomein: Factureren":
        - "Rapporteren afgeroepen vermogens"  # nog geen bestand
