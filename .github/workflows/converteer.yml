name: Converteer Confluence-export

# Upload een Confluence HTML-export (zip) in bron/confluence-export/ en commit naar main.
# Deze workflow zet de export om naar bron/paginas/ en bron/bijlagen/, haalt de zip weer
# uit de repository en start daarna de workflow 'Publiceer site'.

on:
  push:
    branches: [main]
    paths: ["bron/confluence-export/**.zip"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: converteer
  cancel-in-progress: false

jobs:
  converteer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: Installeer pandoc
        run: |
          wget -q https://github.com/jgm/pandoc/releases/download/3.1.11/pandoc-3.1.11-1-amd64.deb
          sudo dpkg -i pandoc-3.1.11-1-amd64.deb
      - run: pip install -r requirements.txt
      - name: Zet export om
        run: |
          python scripts/confluence_naar_md.py | tee conversie.log
          { echo "## Conversie"; echo; echo '```'; cat conversie.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit resultaat en verwijder de zip
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --cached bron/confluence-export/*.zip 2>/dev/null || true
          rm -f bron/confluence-export/*.zip
          git add -A bron/paginas bron/bijlagen
          if git diff --cached --quiet; then echo "Geen wijzigingen."; exit 0; fi
          git commit -q -m "Conversie uit Confluence-export"
          git push
      - name: Start publicatie
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh workflow run publiceer.yml --ref main
