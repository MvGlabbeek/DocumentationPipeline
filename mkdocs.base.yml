# Basisinstellingen voor de MkDocs-weergave. scripts/build_mkdocs.py vult titel,
# navigatie en paden aan vanuit publicatie.yml en schrijft mkdocs.yml.
edit_uri: ""

theme:
  name: material
  language: nl
  features:
    - navigation.indexes
    - navigation.instant
    - navigation.top
    - navigation.footer
    - navigation.path
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: light green
      toggle: {icon: material/brightness-7, name: Donkere modus}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: light green
      toggle: {icon: material/brightness-4, name: Lichte modus}

plugins:
  - search:
      lang: nl

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true

extra_css: []
