# Basisinstellingen voor de MkDocs-weergave. scripts/build_mkdocs.py vult titel,
# navigatie, logo en paden aan vanuit publicatie.yml en schrijft mkdocs.yml.
# Uiterlijk: stijl/huisstijl.css en stijl/mkdocs.css, titelband in overrides/main.html.
edit_uri: ""

theme:
  name: material
  language: nl
  custom_dir: overrides
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.indexes
    - navigation.instant
    - navigation.top
    - navigation.footer
    - search.highlight
    - toc.follow

plugins:
  - search:
      lang: nl

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true

extra:
  generator: false

extra_css: []
