<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{titel}}</title>
  <script src="https://www.w3.org/Tools/respec/respec-w3c" class="remove" defer></script>
  <script class="remove">
    var respecConfig = {{config}};
  </script>
  <style>
    {{css}}
    table { border-collapse: collapse; }
    th, td { border: 1px solid #c8d2d2; padding: 0.3em 0.5em; vertical-align: top; }
    blockquote { border-left: 4px solid #00857c; margin-left: 0; padding-left: 1em; }
  </style>
</head>
<body>
  <section id="abstract">
{{samenvatting}}
  </section>
  <section id="sotd" class="override">
    <h2>Status van dit document</h2>
    <p>{{status}}</p>
    <p>Dit document is automatisch gegenereerd uit de architectuurdocumentatie in Confluence.
      Diagrammen en tabellen staan als genummerde bijlagen in het
      <a href="#overzicht-bijlagen">overzicht bijlagen</a>.</p>
  </section>
{{secties}}
{{bijlagen}}
</body>
</html>
